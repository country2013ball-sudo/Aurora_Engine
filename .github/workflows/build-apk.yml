name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      # Removed the manual Flutter setup step, Flet will handle it.
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Python Dependencies & Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet
          
      - name: Build APK with Flet
        # The 'yes |' automatically accepts the SDK installation prompt
        run: |
          yes | flet build apk --project "framestudio" --org "com.example.framestudio"
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/*.apk
